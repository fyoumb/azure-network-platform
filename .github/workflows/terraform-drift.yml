name: Terraform Drift Detection

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: terraform-drift-dev
  cancel-in-progress: false

jobs:
  drift:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    env:
      TF_VAR_location: "East US"

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Validate Terraform
        run: terraform validate

      - name: Check for drift
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m -detailed-exitcode
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          case "$exit_code" in
            0)
              echo "### No changes detected" >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "### Changes detected — review required" >> "$GITHUB_STEP_SUMMARY"
              echo "Review the plan in the logs. Changes may reflect drift or configuration not yet deployed." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Terraform proposed changes. Review the plan."
              ;;
            *)
              echo "### Drift check failed" >> "$GITHUB_STEP_SUMMARY"
              echo "Terraform could not complete the plan. Review the logs." >> "$GITHUB_STEP_SUMMARY"
              exit "$exit_code"
              ;;
          esac

      - name: Create or update drift review issue
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- terraform-drift-dev -->';
            const title = 'Terraform dev: changes detected — review required';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              'Terraform proposed changes in the dev environment.',
              '',
              `Latest detection: [workflow run #${context.runNumber}](${runUrl})`,
              '',
              'Changes may reflect infrastructure drift or configuration not yet deployed.',
              'Review the plan in the job logs before deciding how to proceed.',
              '',
              'No changes were applied by this workflow.',
              'Close this issue after review and verification of the resolution.'
            ].join('\n');

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            );

            const existing = issues.find(issue =>
              !issue.pull_request &&
              issue.body?.includes(marker)
            );

            let issue;
            if (existing) {
              ({ data: issue } = await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              }));
            } else {
              ({ data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              }));
            }

            await core.summary
              .addLink('Review tracking issue', issue.html_url)
              .write();
